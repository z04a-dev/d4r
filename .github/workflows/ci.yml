name: Kernel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZLUDA_VERSION: "ee2f25a"
  VKD3D_PROTON_VERSION: "3dfc6f07"

jobs:
  check-environment:
    name: Check Environment
    runs-on: ubuntu-latest
    outputs:
      has-nvidia-files: ${{ steps.check_nvidia.outputs.has_nvidia }}
    steps:
      - uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl build-essential \
            x86_64-w64-mingw32-g++ clang-cl \
            wine64 wine32 winegcc winebuild \
            cmake ninja-build pkg-config libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@v2
        with:
          toolchain: stable

      - name: Check for NVIDIA files (for later packaging)
        id: check_nvidia
        run: |
          if [ -f _nvngx.dll ] && [ -f nvngx_dlss.dll ]; then
            echo "has_nvidia=true" >> $GITHUB_OUTPUT
          else
            echo "has_nvidia=false" >> $GITHUB_OUTPUT
          fi

  build-zluda:
    name: Build ZLUDA Library (CPU-compatible)
    runs-on: ubuntu-latest
    needs: check-environment
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone ZLUDA
        run: |
          git clone https://github.com/vosen/ZLUDA zluda
          cd zluda
          git checkout ${{ env.ZLUDA_VERSION }}
          git submodule update --init --recursive
          git lfs pull || true

      - name: Apply ZLUDA patches (CPU-compatible parts)
        working-directory: zluda
        run: |
          for p in 0002 0003 0004 0005 0006 0007 0008; do
            patch_dir="patches/zluda/$p"
            if [ -d "$patch_dir" ]; then
              echo "Applying ZLUDA patches from $patch_dir..."
              for file in "$patch_dir"/*.patch; do
                if [ -f "$file" ]; then
                  git apply "$file" 2>&1 || echo "Patch skipped (already applied)"
                fi
              done
            else
              echo "No patches directory found: $patch_dir"
            fi
          done

      - name: Build ZLUDA PTX helpers
        env:
          ZLUDA_SOURCE_ROOT: ${{ github.workspace }}/zluda
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          echo "Building PTX helper bitcode (CPU compilation only)..."
          # This builds the bitcode files used by device helpers
          cargo build --release -p ptx

      - name: Build ZLUDA with Cargo
        env:
          LIBRARY_PATH: /opt/rocm/lib
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          echo "Building ZLUDA library..."
          cargo build --release -p zluda
          # The libnvcuda.so will be a stub that loads actual ROCm device libs locally

      - name: Install ZLUDA artifacts
        run: |
          mkdir -p ~/.cache/d4r-zluda-current
          cp zluda/target/release/libnvcuda.so ~/.cache/d4r-zluda-current/ || true
          ln -sf libnvcuda.so ~/.cache/d4r-zluda-current/libcuda.so 2>/dev/null || true

      - name: Upload ZLUDA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zluda-artifacts
          path: |
            ~/.cache/d4r-zluda-current/
            zluda/target/release/*.so

  build-vkd3d-proton:
    name: Build vkd3d-proton (CPU-compatible)
    runs-on: ubuntu-latest
    needs: check-environment
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Clone vkd3d-proton
        run: |
          git clone https://gitlab.freedesktop.org/mesa/vkd3d-proton vkd3d-proton
          cd vkd3d-proton
          git checkout ${{ env.VKD3D_PROTON_VERSION }}

      - name: Apply vkd3d-proton patches
        working-directory: vkd3d-proton
        run: |
          if [ -d "patches/vkd3d-proton" ]; then
            git apply ../patches/vkd3d-proton/0001-*.patch 2>&1 || true
            git apply ../patches/vkd3d-proton/0002-*.patch 2>&1 || true
          fi

      - name: Build vkd3d-proton
        working-directory: vkd3d-proton
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVAPI_STUB=ON \
            -DUSE_WINE=OFF \
            -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)

      - name: Install vkd3d-proton
        working-directory: vkd3d-proton/build
        run: |
          make install
          cd ../..
          mv build/vkd3d-shim.dll .

      - name: Upload vkd3d-proton artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vkd3d-proton-artifacts
          path: |
            vkd3d-shim.dll
            vkd3d-proton/vkd3d12.dll

  build-nvngx-shim:
    name: Build NVngx Shim (Windows target)
    runs-on: ubuntu-latest
    needs: check-environment
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create build directory
        run: |
          mkdir -p build

      - name: Build NVngx shim (Windows target)
        working-directory: build
        env:
          CMAKE_C_COMPILER: x86_64-w64-mingw32-gcc
          CMAKE_CXX_COMPILER: x86_64-w64-mingw32-g++
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=$CMAKE_C_COMPILER \
            -DCMAKE_CXX_COMPILER=$CMAKE_CXX_COMPILER \
            -DLIBS="advapi32 user32" || \
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release

      - name: Upload shim artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-shim-artifacts
          path: |
            build/d4r_nvngx.dll 2>/dev/null || true

  build-wine-nvcuda-bridge:
    name: Build Wine CUDA Bridge (Windows target)
    runs-on: ubuntu-latest
    needs: check-environment
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create build directory
        run: |
          mkdir -p build/wine-nvcuda

      - name: Build Wine CUDA bridge (Windows target)
        working-directory: build/wine-nvcuda
        env:
          CMAKE_C_COMPILER: winegcc
          CMAKE_CXX_COMPILER: x86_64-w64-mingw32-g++
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows || \
          echo "Bridge build requires specific toolchain setup"

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wine-nvcuda-bridge
          path: |
            build/wine-nvcuda/*.dll 2>/dev/null || true

  package-local-build-kit:
    name: Package Local Build Kit
    runs-on: ubuntu-latest
    needs: [build-zluda, build-vkd3d-proton, build-nvngx-shim, build-wine-nvcuda-bridge]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: d4r-*
          merge-files: true
          path: d4r-build-kit/

      - name: Organize build kit structure
        run: |
          echo "Building local kit structure..."
          mkdir -p d4r-build-kit/{zluda,vkd3d-proton,shim,nvidia}
          
          # Copy ZLUDA artifacts
          if [ -f ~/.cache/d4r-zluda-current/libnvcuda.so ]; then
            cp ~/.cache/d4r-zluda-current/* d4r-build-kit/zluda/ 2>/dev/null || true
          fi
          
          # Copy vkd3d-proton artifacts
          cp -f vkd3d-shim.dll d4r-build-kit/vkd3d-proton/ 2>/dev/null || true
          cp -f vkd3d12.dll d4r-build-kit/vkd3d-proton/ 2>/dev/null || true
          
          # Copy shim artifacts
          cp -f build/d4r_nvngx.dll d4r-build-kit/shim/ 2>/dev/null || true

      - name: Create installation guide
        run: |
          cat > d4r-build-kit/README.md << 'EOF'
# D4R Local Build Kit

This kit contains all components needed to build native DLSS kernels locally on an AMD ROCm system.

## Components Included

- **zluda/** - ZLUDA library stub (needs local ROCm device libraries)
- **vkd3d-proton/** - vkd3d-shim.dll and vkd3d12.dll (patched)
- **shim/** - d4r_nvngx.dll (NVAPI identity shim)

## How to Use on Your PC

### Step 1: Install ROCm
```bash
# Install ROCm 7.2 (or compatible version)
# See https://rocm.docs.amd.com/ for installation instructions
```

### Step 2: Set Environment Variables
```bash
export D4R_ZLUDA_DIR=~/.cache/d4r-zluda-current
export D4R_VKD3D_DIR=$(pwd)/vkd3d-proton
export D4R_SHIM_DIR=$(pwd)/shim
export D4R_ROCM_DIR=/opt/rocm
```

### Step 3: Copy Artifacts to Your System
```bash
# Copy ZLUDA library
cp d4r-build-kit/zluda/libnvcuda.so ~/.cache/d4r-zluda-current/
ln -sf libnvcuda.so ~/.cache/d4r-zluda-current/libcuda.so

# Copy vkd3d-proton
mkdir -p ~/.cache/d4r-vkd3d-d4r
cp d4r-build-kit/vkd3d-proton/*.dll ~/.cache/d4r-vkd3d-d4r/

# Copy shim
mkdir -p ~/.local/share/d4r-dlss/d4r
cp d4r-build-kit/shim/*.dll ~/.local/share/d4r-dlss/d4r/
```

### Step 4: Build Native Kernels Locally
On your AMD ROCm system, with ROCm installed:

```bash
# Build preset K kernels (DLSS 4.0)
cd d4r-build-kit
D4R_ROCM_DIR=/opt/rocm ./build-native-kernels.sh k

# Build preset M/L kernels (DLSS 4.5)
D4R_ROCM_DIR=/opt/rocm ./build-native-kernels.sh m

# If you have NVIDIA DLLs for texture kernels:
D4R_DLSS_DLL=/path/to/nvngx_dlss.dll \
D4R_ZLUDA_EMIT=zluda/target/release/examples/d4r_emit \
./build-native-kernels.sh l
```

### Step 5: Configure d4r.ini
```ini
[Kernels]
NativeKernelDirFast=kernels/out/native
PreferAccuracy=false

[Paths]
ZludaDir=~/.cache/d4r-zluda-current
VkD3DDir=~/.cache/d4r-vkd3d-d4r
RuntimeDir=~/.local/share/d4r-dlss
```

## Building from Source (Alternative)

If you prefer building from source on your own ROCm system:

1. Clone this repository
2. Install ROCm at `/opt/rocm`
3. Run `./kernels/build.sh all kernels/out/native`
4. Configure d4r.ini with the output path

## Notes

- The ZLUDA library stub is compiled for GLIBC 2.41 compatibility
- Actual GPU device libraries are loaded from your local ROCm installation
- This kit enables building kernels on systems without GitHub Actions runners
EOF

      - name: Upload build kit package
        uses: actions/upload-artifact@v4
        with:
          name: d4r-local-build-kit
          path: d4r-build-kit/
          if-no-files-found: skip

  create-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [build-zluda, build-vkd3d-proton]
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
# D4R Release Notes

## Components Built in CI

### ZLUDA Library
- **Version**: ee2f25a with patches 0002–0008 applied
- **Purpose**: CUDA driver API stub that redirects to local ROCm device libraries
- **Usage**: Place in `~/.cache/d4r-zluda-current/`

### vkd3d-proton
- **Version**: GE-Proton11-3 (3dfc6f07) with D4R patches 0001–0002 applied
- **Purpose**: Handles command list splitting at DLSS calls for synchronous frame rendering
- **Usage**: Place in `~/.cache/d4r-vkd3d-d4r/`

## Next Steps

### Option A: Build Kernels Locally (Recommended)
1. Download the `d4r-local-build-kit` artifact
2. Follow the installation guide in the README.md
3. On your AMD ROCm system, build kernels with:
   ```bash
   D4R_ROCM_DIR=/opt/rocm ./kernels/build.sh all kernels/out/native
   ```

### Option B: Full Build (Requires GPU)
For building texture kernels (L's shared network layers), you'll also need:
- NVIDIA DLLs (`_nvngx.dll`, `nvngx_dlss.dll`) for PTX extraction
- The ZLUDA emitter (`d4r_emit`) which compiles PTX offline

## Build Commands Reference

### Quick Start on Your System
```bash
# Clone repo and build everything
git clone https://github.com/your-org/d4r-z04a.git
cd d4r-z04a

# Build native kernels (requires ROCm installed)
D4R_ROCM_DIR=/opt/rocm ./kernels/build.sh all kernels/out/native

# Package release with NVIDIA DLLs and OptiScaler
scripts/package_release.sh -> dist/d4r-<version>.zip
```

### Check Environment First
```bash
scripts/check_environment.sh
```

### GLIBC 2.41 Compatible Build
```bash
D4R_RELEASE_BUILD_ROOT=/work/build \
docker build -f packaging/build/Dockerfile.glibc241 \
  -t d4r-build:glibc241 packaging/build
```

## Testing

After installation:
- Run `scripts/d4r_play.sh` to launch a game
- Check that DLSS appears in the upscaler list
- Use OptiScaler in-game (set as default or select manually)

## Supported Games

See [SUPPORTED_GAMES.md](SUPPORTED_GAMES.md) for a list of tested games.

## License

This project uses AMD ROCm device libraries and NVIDIA CUDA/NGX components under their respective licenses.
EOF

          cat RELEASE_NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: d4r-release-notes
          path: RELEASE_NOTES.md

  create-zip-package:
    name: Create ZIP Package
    runs-on: ubuntu-latest
    needs: package-local-build-kit
    steps:
      - uses: actions/checkout@v4

      - name: Download build kit artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-local-build-kit
          path: ./d4r-build-kit/

      - name: Create ZIP package
        run: |
          cd d4r-build-kit
          zip -r ../d4r-local-build-kit.zip .
          unzip -l ../d4r-local-build-kit.zip

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: d4r-local-build-kit-zip
          path: d4r-local-build-kit.zip
name: Kernel CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all components for local kit
        required: true
        default: all
        type: choice
        options:
          - all (ZLUDA, vkd3d-proton, shims)
          - zluda-only
          - vkd3d-only

jobs:
  build-zluda:
    name: Build ZLUDA Library (CPU-compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || inputs.build_all == 'all' || inputs.build_all == 'zluda-only'
    steps:
      - uses: actions/checkout@v4

      - name: Clone ZLUDA
        run: |
          git clone https://github.com/vosen/ZLUDA zluda
          cd zluda
          git checkout $ZLUDA_VERSION
          git submodule update --init --recursive
          git lfs pull || true

      - name: Apply ZLUDA patches (CPU-compatible parts)
        working-directory: zluda
        run: |
          for p in 0002 0003 0004 0005 0006 0007 0008; do
            patch_dir="patches/zluda/$p"
            if [ -d "$patch_dir" ]; then
              echo "Applying ZLUDA patches from $patch_dir..."
              for file in "$patch_dir"/*.patch; do
                if [ -f "$file" ]; then
                  git apply "$file" 2>&1 || echo "Patch skipped (already applied)"
                fi
              done
            else
              echo "No patches directory found: $patch_dir"
            fi
          done

      - name: Build ZLUDA PTX helpers
        env:
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          cargo build --release -p ptx

      - name: Build ZLUDA with Cargo
        env:
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          cargo build --release -p zluda

      - name: Install ZLUDA artifacts
        run: |
          mkdir -p ~/.cache/d4r-zluda-current
          cp zluda/target/release/libnvcuda.so ~/.cache/d4r-zluda-current/ || true
          ln -sf libnvcuda.so ~/.cache/d4r-zluda-current/libcuda.so 2>/dev/null || true

      - name: Upload ZLUDA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-zluda-artifacts
          path: |
            ~/.cache/d4r-zluda-current/
            zluda/target/release/*.so

  build-vkd3d-proton:
    name: Build vkd3d-proton (CPU-compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || inputs.build_all == 'all' || inputs.build_all == 'vkd3d-only'
    steps:
      - uses: actions/checkout@v4

      - name: Clone vkd3d-proton
        run: |
          git clone https://gitlab.freedesktop.org/mesa/vkd3d-proton vkd3d-proton
          cd vkd3d-proton
          git checkout $VKD3D_PROTON_VERSION

      - name: Build vkd3d-proton
        working-directory: vkd3d-proton
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVAPI_STUB=ON \
            -DUSE_WINE=OFF \
            -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)

      - name: Install vkd3d-proton
        working-directory: vkd3d-proton/build
        run: |
          make install
          cd ../..
          mv build/vkd3d-shim.dll .

      - name: Upload vkd3d-proton artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-vkd3d-artifacts
          path: |
            vkd3d-shim.dll
            vkd3d-proton/vkd3d12.dll

  build-nvngx-shim:
    name: Build NVngx Shim (Windows target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && inputs.build_all == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Create build directory
        run: |
          mkdir -p build

      - name: Build NVngx shim (Windows target)
        working-directory: build
        env:
          CMAKE_C_COMPILER: x86_64-w64-mingw32-gcc
          CMAKE_CXX_COMPILER: x86_64-w64-mingw32-g++
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=$CMAKE_C_COMPILER \
            -DCMAKE_CXX_COMPILER=$CMAKE_CXX_COMPILER \
            -DLIBS="advapi32 user32" || \
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release

      - name: Upload shim artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-shim-artifacts
          path: |
            build/d4r_nvngx.dll 2>/dev/null || true

  package-local-build-kit:
    name: Package Local Build Kit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-zluda, build-vkd3d-proton, build-nvngx-shim]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download ZLUDA artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-zluda-artifacts
          path: d4r-build-kit/zluda

      - name: Download vkd3d-proton artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-vkd3d-artifacts
          path: d4r-build-kit/vkd3d-proton

      - name: Download shim artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-shim-artifacts
          path: d4r-build-kit/shim 2>/dev/null || true

      - name: Upload build kit package
        uses: actions/upload-artifact@v4
        with:
          name: d4r-local-build-kit
          path: d4r-build-kit/
          if-no-files-found: skip
name: Kernel CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all components for local kit
        required: true
        default: all
        type: choice
        options:
          - all (ZLUDA, vkd3d-proton)
          - zluda-only

jobs:
  build-zluda:
    name: Build ZLUDA Library (CPU-compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || inputs.build_all == 'all' || inputs.build_all == 'zluda-only'
    steps:
      - uses: actions/checkout@v4

      - name: Clone ZLUDA
        run: |
          git clone https://github.com/vosen/ZLUDA zluda
          cd zluda
          git checkout ee2f25a
          git submodule update --init --recursive
          git lfs pull || true

      - name: Apply ZLUDA patches (CPU-compatible parts)
        working-directory: zluda
        run: |
          for p in 0002 0003 0004 0005 0006 0007 0008; do
            patch_dir="patches/zluda/$p"
            if [ -d "$patch_dir" ]; then
              echo "Applying ZLUDA patches from $patch_dir..."
              for file in "$patch_dir"/*.patch; do
                if [ -f "$file" ]; then
                  git apply "$file" 2>&1 || echo "Patch skipped (already applied)"
                fi
              done
            else
              echo "No patches directory found: $patch_dir"
            fi
          done

      - name: Build ZLUDA PTX helpers
        env:
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          cargo build --release -p ptx

      - name: Build ZLUDA with Cargo
        env:
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          cargo build --release -p zluda

      - name: Install ZLUDA artifacts
        run: |
          mkdir -p /home/runner/work/d4r/d4r/.cache/d4r-zluda-current
          cp zluda/target/release/libnvcuda.so /home/runner/work/d4r/d4r/.cache/d4r-zluda-current/ || true
          ln -sf libnvcuda.so /home/runner/work/d4r/d4r/.cache/d4r-zluda-current/libcuda.so 2>/dev/null || true

      - name: Upload ZLUDA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-zluda-artifacts
          path: |
            /home/runner/work/d4r/d4r/.cache/d4r-zluda-current/
            zluda/target/release/*.so

  build-vkd3d-proton:
    name: Build vkd3d-proton (CPU-compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || inputs.build_all == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Clone and setup vkd3d-proton (cached source)
        run: |
          SRC="/home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton"
          COMMIT="3dfc6f07"
          
          if [[ ! -d "$SRC/.git" ]]; then
            echo "Cloning vkd3d-proton..."
            git clone https://github.com/HansKristian-Work/vkd3d-proton.git "$SRC"
          else
            echo "Using cached vkd3d-proton source"
          fi
          
          cd "$SRC"
          git checkout -f -B d4r-split "$COMMIT" 2>/dev/null || git checkout "$COMMIT" 2>/dev/null || true
          git submodule update --init --recursive

      - name: Apply vkd3d-proton patches
        run: |
          PATCH_DIR="/home/runner/work/d4r/d4r/patches/vkd3d-proton"
          cd "$SRC"
          if [ -d "$PATCH_DIR" ]; then
            echo "Applying vkd3d-proton patches..."
            for patchfile in "$PATCH_DIR"/*.patch; do
              if [ -f "$patchfile" ]; then
                echo "Applying: $patchfile"
                git apply "$patchfile" 2>&1 || echo "Patch skipped or already applied: $patchfile"
              fi
            done
          else
            echo "No patches directory found at $PATCH_DIR/"
          fi

      - name: Install mingw-w64 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            mingw-w64-tools \
            meson \
            ninja-build \
            libcurl4-openssl-dev \
            libjson-c-dev \
            libkrb5-dev \
            uuid-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libdbus-1-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libglslang-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libvulkan-dev \
            libffi-dev \
            pkg-config

      - name: Configure cross-compilation toolchain
        run: |
          VKD3D_SRC="/home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton"
          printf '%s\n' \
            '[binaries]' \
            "c = 'x86_64-w64-mingw32-gcc'" \
            "cpp = 'x86_64-w64-mingw32-g++'" \
            'ar = '"'"'x86_64-w64-mingw32-ar'"'"'' \
            "strip = 'x86_64-w64-mingw32-strip'" \
            "widl-mingw-tools-fallback = 'x86_64-w64-mingw32-widl'" \
            '' \
            '[properties]' \
            "needs_exe_wrapper = true" \
            '' \
            '[host_machine]' \
            "system = 'windows'" \
            "cpu_family = 'x86_64'" \
            'cpu = '"'"'x86_64'"'"'' \
            "endian = 'little'" \
            > "$VKD3D_SRC/build-win64.txt"

      - name: Configure with meson
        run: |
          cd /home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton
          meson setup builddir . --cross-file build-win64.txt --buildtype release -Denable_tests=false

      - name: Build vkd3d-proton (mingw target)
        run: |
          cd /home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/builddir
          ninja -j"$(nproc)"

      - name: Copy DLLs to output
        run: |
          mkdir -p /home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/vkd3d-output
          
          if [ -f "builddir/libs/d3d12/d3d12.dll" ]; then
            cp builddir/libs/d3d12/d3d12.dll "/home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/vkd3d-output/"
          fi
          
          if [ -f "builddir/libs/d3d12core/d3d12core.dll" ]; then
            cp builddir/libs/d3d12core/d3d12core.dll "/home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/vkd3d-output/"
          fi

      - name: Upload vkd3d-proton artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-vkd3d-artifacts
          path: |
            /home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/vkd3d-output/**

  package-local-build-kit:
    name: Package Local Build Kit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-zluda, build-vkd3d-proton]
    if: github.event_name == 'workflow_dispatch' || inputs.build_all == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Download ZLUDA artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-zluda-artifacts
          path: d4r-build-kit/zluda

      - name: Download vkd3d-proton artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-vkd3d-artifacts
          path: d4r-build-kit/vkd3d-proton

      - name: Create ZIP package
        run: |
          cd /home/runner/work/d4r/d4r/.cache
          zip -r ../d4r-local-build-kit.zip d4r-zluda-current/ vkd3d-proton/

      - name: Upload build kit package
        uses: actions/upload-artifact@v4
        with:
          name: d4r-local-build-kit.zip
          path: |
            .github/d4r-local-build-kit.zip
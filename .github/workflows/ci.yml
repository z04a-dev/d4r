name: Kernel CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all components for local kit
        required: true
        default: all
        type: choice
        options:
          - all (ZLUDA, vkd3d-proton)
          - zluda-only

env:
  ZLUDA_VERSION: "ee2f25a"

jobs:
  build-zluda:
    name: Build ZLUDA Library (CPU-compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || inputs.build_all == 'all' || inputs.build_all == 'zluda-only'
    steps:
      - uses: actions/checkout@v4

      - name: Clone ZLUDA
        run: |
          git clone https://github.com/vosen/ZLUDA zluda
          cd zluda
          git checkout $ZLUDA_VERSION
          git submodule update --init --recursive
          git lfs pull || true

      - name: Apply ZLUDA patches (CPU-compatible parts)
        working-directory: zluda
        run: |
          for p in 0002 0003 0004 0005 0006 0007 0008; do
            patch_dir="patches/zluda/$p"
            if [ -d "$patch_dir" ]; then
              echo "Applying ZLUDA patches from $patch_dir..."
              for file in "$patch_dir"/*.patch; do
                if [ -f "$file" ]; then
                  git apply "$file" 2>&1 || echo "Patch skipped (already applied)"
                fi
              done
            else
              echo "No patches directory found: $patch_dir"
            fi
          done

      - name: Build ZLUDA PTX helpers
        env:
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          cargo build --release -p ptx

      - name: Build ZLUDA with Cargo
        env:
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          cargo build --release -p zluda

      - name: Install ZLUDA artifacts
        run: |
          mkdir -p ~/.cache/d4r-zluda-current
          cp zluda/target/release/libnvcuda.so ~/.cache/d4r-zluda-current/ || true
          ln -sf libnvcuda.so ~/.cache/d4r-zluda-current/libcuda.so 2>/dev/null || true

      - name: Upload ZLUDA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-zluda-artifacts
          path: |
            ~/.cache/d4r-zluda-current/
            zluda/target/release/*.so

  build-vkd3d-proton:
    name: Build vkd3d-proton (CPU-compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || inputs.build_all == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Clone and setup vkd3d-proton (cached source)
        run: |
          SRC="$HOME/.cache/d4r-vkd3d-proton"
          COMMIT="3dfc6f07"
          
          if [[ ! -d "$SRC/.git" ]]; then
            echo "Cloning vkd3d-proton..."
            git clone https://github.com/HansKristian-Work/vkd3d-proton.git "$SRC"
          else
            echo "Using cached vkd3d-proton source"
          fi
          
          cd "$SRC"
          git checkout -f -B d4r-split "$COMMIT" 2>/dev/null || git checkout "$COMMIT" 2>/dev/null || true
          git submodule update --init --recursive

      - name: Apply vkd3d-proton patches
        working-directory: $HOME/.cache/d4r-vkd3d-proton
        run: |
          if [ -d "patches/vkd3d-proton" ]; then
            echo "Applying vkd3d-proton patches..."
            for patchfile in patches/vkd3d-proton/*.patch; do
              if [ -f "$patchfile" ]; then
                echo "Applying: $patchfile"
                git apply "$patchfile" 2>&1 || echo "Patch skipped or already applied: $patchfile"
              fi
            done
          else
            echo "No patches directory found at patches/vkd3d-proton/"
          fi

      - name: Configure cross-compilation toolchain
        run: |
          printf '[binaries]\n' > "$HOME/.cache/d4r-vkd3d-proton/build-win64.txt"
          printf "  ar = x86_64-w64-mingw32-ar\n" >> "$HOME/.cache/d4r-vkd3d-proton/build-win64.txt"
          printf "  as = x86_64-w64-mingw32-as\n" >> "$HOME/.cache/d4r-vkd3d-proton/build-win64.txt"
          printf "  gcc = x86_64-w64-mingw32-gcc\n" >> "$HOME/.cache/d4r-vkd3d-proton/build-win64.txt"
          printf "  g++ = x86_64-w64-mingw32-g++\n" >> "$HOME/.cache/d4r-vkd3d-proton/build-win64.txt"
          printf "  link = x86_64-w64-mingw32-link\n" >> "$HOME/.cache/d4r-vkd3d-proton/build-win64.txt"
          printf '[prefix]\n' >> "$HOME/.cache/d4r-vkd3d-proton/build-win64.txt"
          printf "  /usr\n" >> "$HOME/.cache/d4r-vkd3d-proton/build-win64.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64-x86-64 \
            wine64 \
            libcurl4-openssl-dev \
            libjson-c-dev \
            libkrb5-dev \
            libuuid-dev \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libdbus-1-dev \
            libxcb-dri3-dev \
            libxcb-xfixes-dev \
            wayland-protocols \
            nss-dev \
            libxnvctrl-dev \
            vulkan-utils

      - name: Configure with meson
        working-directory: $HOME/.cache/d4r-vkd3d-proton
        run: |
          meson setup --cross-file build-win64.txt --buildtype release -Denable_tests=false builddir src

      - name: Build vkd3d-proton (mingw target)
        working-directory: $HOME/.cache/d4r-vkd3d-proton/builddir
        run: |
          ninja -C builddir

      - name: Strip and copy DLLs to output
        working-directory: $HOME/.cache/d4r-vkd3d-proton
        run: |
          mkdir -p vkd3d-output
          x86_64-w64-mingw32-strip -o "vkd3d-output/d3d12.dll" builddir/libs/d3d12/d3d12.dll 2>/dev/null || true
          x86_64-w64-mingw32-strip -o "vkd3d-output/d3d12core.dll" builddir/libs/d3d12core/d3d12core.dll 2>/dev/null || true
          
          # Also copy shim if it exists
          if [ -f "builddir/bin/vkd3d-shim.dll" ]; then
            cp builddir/bin/vkd3d-shim.dll vkd3d-output/
          fi

      - name: Upload vkd3d-proton artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-vkd3d-artifacts
          path: |
            $HOME/.cache/d4r-vkd3d-proton/vkd3d-output/**

  package-local-build-kit:
    name: Package Local Build Kit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-zluda, build-vkd3d-proton]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download ZLUDA artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-zluda-artifacts
          path: d4r-build-kit/zluda

      - name: Download vkd3d-proton artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-vkd3d-artifacts
          path: d4r-build-kit/vkd3d-proton

      - name: Organize build kit
        run: |
          echo "Build kit structure created"

      - name: Upload build kit package
        uses: actions/upload-artifact@v4
        with:
          name: d4r-local-build-kit
          path: d4r-build-kit/
          if-no-files-found: skip
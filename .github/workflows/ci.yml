name: Kernel CI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: What to build for local kit
        required: true
        default: all
        type: choice
        options:
          - emit-only (d4r_emit + vkd3d-proton, no full ZLUDA)

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type }}

jobs:
  # =============================================================================
  # JOB: build-emit-only
  # Description: Builds only d4r_emit (fast mode)
  # =============================================================================
  build-emit-only:
    name: Build d4r_emit only (fast, for 'emit-only' mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Clone and setup ZLUDA (cached)
        run: |
          git clone https://github.com/vosen/ZLUDA zluda
          cd zluda
          git checkout ee2f25a
          git submodule update --init --recursive
          git lfs pull || true

      - name: Apply ZLUDA patches (required for d4r_emit)
        run: |
          CD_ZLUDA_PATH="/home/runner/work/d4r/d4r"
          PATCH_DIR="$CD_ZLUDA_PATH/patches/zluda"
          cd "$CD_ZLUDA_PATH/zluda"
          for file in "$PATCH_DIR"/*.patch; do
            if [ -f "$file" ]; then
              echo "Applying patch: $file"
              git apply "$file" 2>&1 || echo "Patch skipped or already applied: $file"
            fi
          done

      - name: Build PTX helpers and d4r_emit only
        env:
          CARGO_BUILD_JOBS: 8
        run: |
          cd zluda
          cargo build --release -p ptx
          cargo build --release -p ptx --example d4r_emit

      - name: Install d4r_emit to cache
        run: |
          mkdir -p /home/runner/work/d4r/d4r/.cache/d4r-zluda-current
          cp zluda/target/release/d4r_emit /home/runner/work/d4r/d4r/.cache/d4r-zluda-current/ || true

      - name: Upload d4r_emit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d4r-zluda-artifacts
          path: |
            /home/runner/work/d4r/d4r/.cache/d4r-zluda-current/

  # =============================================================================
  # JOB: build-vkd3d-proton-emit-only
  # Description: Builds vkd3d-proton for 'emit-only' mode (same DLLs, different job)
  # =============================================================================
  build-vkd3d-proton-emit-only:
    name: Build vkd3d-proton (for 'emit-only' mode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone and setup vkd3d-proton (cached source)
        run: |
          SRC="/home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton"
          COMMIT="3dfc6f07"
          
          if [[ ! -d "$SRC/.git" ]]; then
            echo "Cloning vkd3d-proton..."
            git clone https://github.com/HansKristian-Work/vkd3d-proton.git "$SRC"
            cd "$SRC"
            git config submodule.include/vkd3d/core.active true 2>/dev/null || true
            git config submodule.include/vkd3d/shaders.active true 2>/dev/null || true
            git config submodule.include/vkd3d/shell.active false 2>/dev/null || true
          else
            echo "Using cached vkd3d-proton source"
            cd "$SRC"
          fi
          
          cd "$SRC"
          git checkout -f -B d4r-split "$COMMIT" 2>/dev/null || git checkout "$COMMIT" 2>/dev/null || true
          if [[ -f ".gitmodules" ]]; then
            echo "Initializing submodules..."
            git submodule update --init --recursive 2>&1 || echo "Submodule init had issues, continuing anyway"
          fi

      - name: Apply vkd3d-proton patches
        run: |
          cd "$SRC"
          PATCH_DIR="/home/runner/work/d4r/d4r/patches/vkd3d-proton"
          for file in "$PATCH_DIR"/*.patch; do
            if [ -f "$file" ]; then
              echo "=== Applying patch: $file ==="
              git apply "$file" --whitespace=nowarn 2>&1 || echo "Warning: Patch had issues: $file"
            fi
          done

      - name: Install mingw-w64 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            mingw-w64-tools \
            meson \
            ninja-build \
            libcurl4-openssl-dev \
            libjson-c-dev \
            libkrb5-dev \
            uuid-dev \
            libx11-dev \
            glslang-dev \
            glslang-tools \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libdbus-1-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libvulkan-dev \
            libffi-dev \
            pkg-config

      - name: Configure cross-compilation toolchain
        run: |
          VKD3D_SRC="/home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton"
          printf '%s\n' \
            '[binaries]' \
            "c = 'x86_64-w64-mingw32-gcc'" \
            "cpp = 'x86_64-w64-mingw32-g++'" \
            'ar = '"'"'x86_64-w64-mingw32-ar'"'"'' \
            "strip = 'x86_64-w64-mingw32-strip'" \
            "widl-mingw-tools-fallback = 'x86_64-w64-mingw32-widl'" \
            '' \
            '[properties]' \
            "needs_exe_wrapper = true" \
            '' \
            '[host_machine]' \
            "system = 'windows'" \
            "cpu_family = 'x86_64'" \
            'cpu = '"'"'x86_64'"'"'' \
            "endian = 'little'" \
            > "$VKD3D_SRC/build-win64.txt"

      - name: Configure with meson
        run: |
          cd /home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton
          meson setup builddir . --cross-file build-win64.txt --buildtype release -Denable_tests=false

      - name: Build vkd3d-proton (mingw target)
        run: |
          cd /home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/builddir
          ninja -j"$(nproc)"

      - name: Copy DLLs to output
        run: |
          VKD3D_BUILD="/home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/builddir"
          OUTPUT_DIR="/home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/vkd3d-output"
          
          mkdir -p "$OUTPUT_DIR"
          
          # Find all .dll files and copy them
          if [ -d "$VKD3D_BUILD/libs" ]; then
            echo "Found DLLs in $VKD3D_BUILD/libs:"
            find "$VKD3D_BUILD/libs" -name '*.dll' 2>/dev/null | while read f; do
              echo "  $f"
              cp "$f" "$OUTPUT_DIR/" || true
            done
          else
            echo "No libs directory found in build tree"
          fi

      - name: Upload vkd3d-proton artifacts (emit-only mode)
        uses: actions/upload-artifact@v4
        with:
          name: d4r-vkd3d-artifacts
          path: |
            /home/runner/work/d4r/d4r/.cache/d4r-vkd3d-proton/vkd3d-output/*.dll

  # =============================================================================
  # JOB: package-local-build-kit-emit-only
  # Description: Packages emit + vkd3d-proton only (only for 'emit-only' mode)
  # Depends on: build-emit-only, build-vkd3d-proton-emit-only
  # =============================================================================
  package-local-build-kit-emit-only:
    name: Package Local Build Kit (emit + vkd3d-proton only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-emit-only, build-vkd3d-proton-emit-only]
    steps:
      - uses: actions/checkout@v4

      - name: Download ZLUDA artifacts (d4r_emit only for emit-only mode)
        uses: actions/download-artifact@v4
        with:
          name: d4r-zluda-artifacts
          path: d4r-build-kit/zluda

      - name: Download vkd3d-proton artifacts
        uses: actions/download-artifact@v4
        with:
          name: d4r-vkd3d-artifacts
          path: d4r-build-kit/vkd3d-proton

      - name: Create ZIP package
        run: |
          cd /home/runner/work/d4r/d4r/.cache
          zip -r ../d4r-local-build-kit.zip d4r-zluda-current/ vkd3d-proton/

      - name: Upload build kit package
        uses: actions/upload-artifact@v4
        with:
          name: d4r-local-build-kit.zip
          path: |
            .github/d4r-local-build-kit.zip